<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Adnaan Janees — Software Engineer in Test">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(60 40) scale(900 520)">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#bc8cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="4" fill="url(#edge)"/>

  <g transform="translate(64 78)">
    <rect x="0" y="12" width="28" height="2" fill="url(#rule)"/>
    <text x="42" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.4" fill="#58a6ff">SOFTWARE ENGINEER IN TEST · COLOMBO, SRI LANKA</text>

    <text x="0" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#f0f6fc">Adnaan Janees</text>

    <text x="0" y="140" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#8b949e">Working across <tspan fill="#3fb950" font-weight="600">test automation</tspan> and <tspan fill="#58a6ff" font-weight="600">software development</tspan> — building reliable</text>
    <text x="0" y="170" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#8b949e">automation solutions and contributing to feature delivery.</text>
  </g>
</svg>
